<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>云端发帖神器</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f4f5f7; margin: 0; padding: 0; }
        .header { display: flex; align-items: center; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); min-height: 35px; }
        #cat-tabs { display: flex; overflow-x: auto; gap: 10px; flex-grow: 1; padding-bottom: 5px; align-items: center; }
        #cat-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #f0f0f0; color: #666; border-radius: 20px; padding: 8px 16px; font-size: 14px; border: none; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active-tab { background: #0066ff; color: white; font-weight: bold; }
        #settings-btn { background: none; color: #888; border: none; font-size: 24px; padding: 0 0 0 10px; }
        .main-area { margin-top: 5vh; padding: 20px; }
        #counter { color: #888; margin-bottom: 10px; font-size: 16px; }
        #sync-status { color: #ff9800; font-size: 12px; margin-bottom: 15px; height: 16px; font-weight: bold; }
        .copy-btn { font-size: 20px; padding: 20px 40px; background: #0066ff; color: white; border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,102,255,0.3); width: 90%; max-width: 350px; font-weight: bold; transition: 0.2s; }
        .copy-btn:disabled { background: #cccccc; box-shadow: none; }
        #display { margin: 20px auto; font-size: 15px; color: #333; min-height: 100px; text-align: left; background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; box-sizing: border-box; line-height: 1.6; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        
        #settings-area { display: none; position: absolute; top: 65px; left: 0; right: 0; background: white; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 100; text-align: left; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; }
        textarea { width: 100%; height: 100px; padding: 12px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; margin: 10px 0; font-size: 14px; resize: none; }
        input.config-input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn-small { font-size: 14px; padding: 10px 15px; border: none; border-radius: 8px; color: white; margin-bottom: 5px; cursor: pointer; }
        .btn-success { background: #4caf50; }
        .btn-primary { background: #2196f3; display: inline-block; text-align: center;}
        .btn-warning { background: #ff9800; }
        .btn-danger { background: #f44336; }
        .btn-dark { background: #333; }
        .tip { font-size: 12px; color: #ff9800; margin-bottom: 5px; background: #fff3e0; padding: 8px; border-radius: 6px; }
        .config-box { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="header">
        <div id="cat-tabs"></div>
        <button id="settings-btn" onclick="toggleSettings()">⚙️</button>
    </div>

    <!-- 设置区域 -->
    <div id="settings-area">
        <div class="config-box">
            <h4 style="margin:0 0 10px 0;">🔗 云端数据库绑定</h4>
            <input type="text" id="cfg-token" class="config-input" placeholder="填入 GitHub Token (ghp_开头)">
            <input type="text" id="cfg-gist" class="config-input" placeholder="填入 Gist ID">
            <button class="btn-small btn-dark" onclick="saveConfig()">保存配置并强制拉取</button>
        </div>

        <h3 style="margin-top:0;">导入文案库</h3>
        <textarea id="import-text" placeholder="长按粘贴..."></textarea>
        <div>
            <button class="btn-small btn-success" onclick="importData()">➕ 粘贴导入</button>
            <label for="txt-upload" class="btn-small btn-primary">📁 选择TXT导入</label>
            <input type="file" id="txt-upload" accept=".txt" style="display:none;" onchange="handleFileUpload(event)">
            <button class="btn-small btn-warning" onclick="deleteCurrentCat()">✂️ 删当前分类</button>
            <button class="btn-small btn-danger" onclick="clearData()">🗑️ 清空云端</button>
        </div>
    </div>

    <div class="main-area">
        <div id="counter">暂无数据</div>
        <div id="sync-status"></div>
        <button class="copy-btn" id="main-btn" onclick="copyNext()">复制下一条</button>
        <div id="display">请先点击右上角⚙️绑定云端...</div>
    </div>

    <script>
        let wenanData = {};
        let currentCat = null;
        
        let GITHUB_TOKEN = localStorage.getItem('gh_token') || '';
        let GIST_ID = localStorage.getItem('gh_gist') || '';

        function setSyncStatus(msg, isError=false) {
            let el = document.getElementById('sync-status');
            el.innerText = msg;
            el.style.color = isError ? '#f44336' : '#ff9800';
            if(!msg) el.innerText = ''; 
        }

        async function fetchFromCloud() {
            if (!GITHUB_TOKEN || !GIST_ID) return;
            setSyncStatus("☁️ 正在拉取云端数据...");
            try {
                let timestamp = new Date().getTime(); 
                let res = await fetch(`https://api.github.com/gists/${GIST_ID}?t=${timestamp}`, {
                    headers: { 
                        'Accept': 'application/vnd.github+json',
                        'Authorization': `Bearer ${GITHUB_TOKEN}` 
                    }
                });
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) throw new Error("401 密钥无权限");
                    if (res.status === 404) throw new Error("404 找不到数据");
                    throw new Error(res.status);
                }
                let data = await res.json();
                let content = data.files['wenan.json'].content;
                wenanData = JSON.parse(content || '{}');
                
                let savedCat = localStorage.getItem('currentCat');
                if (savedCat && wenanData[savedCat] !== undefined) {
                    currentCat = savedCat;
                } else {
                    let keys = Object.keys(wenanData);
                    currentCat = keys.length > 0 ? keys[0] : null;
                }
                
                renderTabs();
                updateUI();
                setSyncStatus(""); 
            } catch (error) {
                setSyncStatus("❌ 拉取失败 (" + error.message + ")", true);
            }
        }

        async function pushToCloud() {
            if (!GITHUB_TOKEN || !GIST_ID) {
                setSyncStatus("❌ 未配置云端密钥", true);
                return;
            }
            setSyncStatus("☁️ 正在同步至云端...");
            try {
                let res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: {
                        'Accept': 'application/vnd.github+json',
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        files: { 'wenan.json': { content: JSON.stringify(wenanData) } }
                    })
                });
                
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) throw new Error("401 密钥无权限");
                    if (res.status === 404) throw new Error("404 找不到数据");
                    throw new Error("网络代码 " + res.status);
                }
                setSyncStatus("");
            } catch (error) {
                setSyncStatus("❌ 同步失败 (" + error.message + ")", true);
            }
        }

        function init() {
            document.getElementById('cfg-token').value = GITHUB_TOKEN;
            document.getElementById('cfg-gist').value = GIST_ID;
            if (GITHUB_TOKEN && GIST_ID) {
                fetchFromCloud(); 
            } else {
                renderTabs();
            }
        }

        function saveConfig() {
            // 强制去除首尾可能存在的空格和换行
            GITHUB_TOKEN = document.getElementById('cfg-token').value.trim().replace(/\s/g, '');
            GIST_ID = document.getElementById('cfg-gist').value.trim().replace(/\s/g, '');
            localStorage.setItem('gh_token', GITHUB_TOKEN);
            localStorage.setItem('gh_gist', GIST_ID);
            toggleSettings();
            fetchFromCloud();
        }

        function renderTabs() {
            let tabsHtml = '';
            let keys = Object.keys(wenanData);
            if (keys.length === 0) {
                tabsHtml = '<span style="color:#999; font-size:14px; padding: 5px;">暂无分类，请导入数据</span>';
            } else {
                for (let cat in wenanData) {
                    let count = wenanData[cat].length;
                    let activeClass = (cat === currentCat) ? 'active-tab' : '';
                    tabsHtml += `<button class="tab-btn ${activeClass}" onclick="switchCat('${cat}')">${cat} (${count})</button>`;
                }
            }
            document.getElementById('cat-tabs').innerHTML = tabsHtml;
        }

        function switchCat(cat) {
            currentCat = cat;
            if (currentCat) localStorage.setItem('currentCat', currentCat);
            renderTabs();
            updateUI();
            document.getElementById('display').innerText = "已切换到【" + cat + "】，等待复制...";
        }

        function safeFallbackCopy(text, successMsg) {
            try {
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.top = '0';
                textArea.style.left = '0';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                document.getElementById('display').innerText = successMsg;
                document.body.removeChild(textArea);
            } catch (e) {
                document.getElementById('display').innerText = "⚠️ 自动复制拦截，请长按下方文本复制：\n\n" + text;
            }
        }

        function copyNext() {
            if (!currentCat || !wenanData[currentCat] || wenanData[currentCat].length === 0) {
                document.getElementById('display').innerText = "⚠️ 当前分类已空！请拉取或导入。";
                return;
            }
            
            let text = wenanData[currentCat].shift();
            let successMsg = "✅ 已复制并移除：\n\n" + text;

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    let promise = navigator.clipboard.writeText(text);
                    if(promise !== undefined) {
                        promise.then(() => {
                            document.getElementById('display').innerText = successMsg;
                        }).catch(err => {
                            safeFallbackCopy(text, successMsg);
                        });
                    } else {
                        safeFallbackCopy(text, successMsg);
                    }
                } else {
                    safeFallbackCopy(text, successMsg);
                }
            } catch (err) {
                safeFallbackCopy(text, successMsg);
            }
            
            renderTabs(); 
            updateUI();
            pushToCloud(); 
        }

        function updateUI() {
            if (currentCat && wenanData[currentCat]) {
                document.getElementById('counter').innerText = "当前分类剩余: " + wenanData[currentCat].length + " 条";
            } else {
                document.getElementById('counter').innerText = "暂无数据";
                if(GITHUB_TOKEN) document.getElementById('display').innerText = "等待操作...";
            }
        }
        
        function toggleSettings() {
            let el = document.getElementById('settings-area');
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        async function processImport(rawText) {
            let lines = rawText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            let targetCat = currentCat || "未分类"; 
            let importedCount = 0;

            lines.forEach(line => {
                let match = line.match(/^【(.*?)】$/);
                if (match) {
                    targetCat = match[1]; 
                    if (!wenanData[targetCat]) wenanData[targetCat] = []; 
                } else {
                    if (!wenanData[targetCat]) wenanData[targetCat] = [];
                    wenanData[targetCat].push(line);
                    importedCount++;
                }
            });

            if (!currentCat && Object.keys(wenanData).length > 0) {
                currentCat = Object.keys(wenanData)[0];
            }

            document.getElementById('import-text').value = '';
            toggleSettings(); 
            renderTabs();
            updateUI();
            
            if(importedCount > 0) {
                document.getElementById('display').innerText = "导入成功，正在保存至云端...";
                await pushToCloud();
                alert("成功导入并同步 " + importedCount + " 条文案！");
                document.getElementById('display').innerText = "同步完成，等待复制...";
            }
        }

        function importData() {
            let rawText = document.getElementById('import-text').value;
            if(!rawText.trim()) return alert("请先粘贴内容！");
            processImport(rawText);
        }

        function handleFileUpload(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                processImport(e.target.result);
                event.target.value = ''; 
            };
            reader.readAsText(file, 'UTF-8');
        }
        
        async function deleteCurrentCat() {
            if (!currentCat) return alert("当前没有可删除的分类！");
            if(confirm("确定要删除【" + currentCat + "】并同步到云端吗？")) {
                delete wenanData[currentCat];
                let keys = Object.keys(wenanData);
                currentCat = keys.length > 0 ? keys[0] : null;
                renderTabs();
                updateUI();
                await pushToCloud();
                toggleSettings(); 
            }
        }

        async function clearData() {
            if(confirm("确定要清空云端所有文案吗？(不可恢复)")) {
                wenanData = {};
                currentCat = null;
                renderTabs();
                updateUI();
                document.getElementById('display').innerText = "正在清空云端...";
                await pushToCloud();
                document.getElementById('display').innerText = "云端已彻底清空。";
                toggleSettings();
            }
        }

        init();
    </script>
</body>
</html>
